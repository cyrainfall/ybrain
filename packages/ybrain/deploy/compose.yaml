# 部署模板（票据 09 决策）：两容器 + 宿主机 tailscaled。
# 服务器目录 /opt/ybrain/：compose.yaml、.env（600 权限）、vault/、data/、opencode/、headscale/、caddy/。
# headscale 服务的详细配置由票据 18 细化；此处保证编排形态与资源限额正确。
services:
  headscale:
    image: headscale/headscale:0.26
    command: serve
    ports:
      # 只绑回环，仅供宿主调试（curl 127.0.0.1:8080）；公网入口是下面的 caddy:443。
      # 3478/udp（STUN）与 41641/udp（WireGuard 数据面）不由本容器监听：
      # 前者属于未启用的 embedded DERP，后者属于宿主机 tailscaled —— 容器占用会与它冲突。
      # 安全组仍需对公网放行 443/tcp、80/tcp 与 41641/udp。
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/ybrain/headscale:/var/lib/headscale
      # 票据 18：服务端配置（server_url 走 HTTPS、DERP 走官方 map，取舍见该文件头部注释）
      - /opt/ybrain/headscale/config.yaml:/etc/headscale/config.yaml:ro
    mem_limit: 128m
    restart: unless-stopped

  caddy:
    # 票据 18：控制面 TLS 终止。客户端首次登录后会强制改拨 443 并走 TLS，明文 8080 撑不住重连。
    image: caddy:2
    ports:
      - "80:80" # ACME http-01（被拦时自动退回 tls-alpn-01）
      - "443:443"
    volumes:
      - /opt/ybrain/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/ybrain/caddy/data:/data # 证书与 ACME 账户，务必保留
      - /opt/ybrain/caddy/config:/config
    mem_limit: 128m
    restart: unless-stopped

  ybrain:
    # 真实镜像由 CI 构建后写入 .env 的 YBRAIN_IMAGE（票据 17）；
    # 占位默认值只为让「只启动 headscale」（票据 18）时 compose 校验通过
    image: ${YBRAIN_IMAGE:-ybrain-pending:local}
    ports:
      # Web 界面与捕获接口仅绑 Tailscale 网卡，公网不可达
      - "${YBRAIN_TAILSCALE_IP}:4096:4096"
      - "${YBRAIN_TAILSCALE_IP}:8787:8787" # 捕获接口由票据 19 实装
    volumes:
      - /opt/ybrain/vault:/opt/ybrain/vault
      - /opt/ybrain/data:/opt/ybrain/data
      # opencode 自身的会话库与会话历史（默认在容器层 /root/.local/share/opencode），
      # 不挂卷则每次更新镜像重建容器都会清空聊天记录与项目列表
      - /opt/ybrain/opencode:/root/.local/share/opencode
      # 票据 25：Gitee 部署密钥（仅该仓库写权限），宿主上 chmod 600，只读挂进容器
      - /opt/ybrain/gitee_deploy_key:/root/.ssh/gitee_deploy_key:ro
    env_file: .env
    environment:
      # Web 界面基本认证（隧道加密之外的纵深防御）
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      # 票据 25：git 走部署密钥；accept-new 首次自动记录 gitee.com 主机指纹，避免交互阻塞
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/gitee_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
    mem_limit: 1.2g
    restart: unless-stopped
