# headscale 服务端配置（票据 18）。挂进容器 /etc/headscale/config.yaml，数据在 /var/lib/headscale。
#
# 取舍说明（依据票据 09）：
# - 控制面走 HTTPS（Caddy 443 终止 TLS，见 ../caddy/Caddyfile）。必须如此：Tailscale 客户端首次
#   登录成功后会强制改拨 443 并改用 TLS（客户端日志 forcing port 443 dial due to recent noise dial），
#   明文 HTTP 只能撑过第一次连接，服务端一重启客户端就再也连不回来。
# - 域名用 DuckDNS 免费子域名，未备案；DERP 仍走官方 map（实测服务器可达），正常路径是 WireGuard 直连。
# - MagicDNS 关闭：MVP 用 tailnet IP 访问（http://<tailnet-ip>:4096），不让 headscale 接管客户端 DNS。

server_url: https://cyx-ybrain.duckdns.org
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

log:
  format: text
  level: info

policy:
  mode: file
  path: ""

dns:
  magic_dns: false
  override_local_dns: false
  nameservers:
    global: []
  search_domains: []
  extra_records: []

logtail:
  enabled: false

randomize_client_port: false
