name: ybrain-image

on:
  push:
    branches:
      - dev
      - main
    paths:
      - packages/ybrain/**
      - packages/opencode/**
      - .github/workflows/ybrain-image.yml
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build opencode binary (linux-x64)
        run: bun run --cwd packages/opencode build --single

      - name: Assemble image build context
        run: |
          mkdir -p packages/ybrain/deploy/context/plugin
          cp packages/opencode/dist/opencode-linux-x64/bin/opencode packages/ybrain/deploy/context/opencode
          # Bundle plugin into a single file so multi-module plugins and their
          # dependencies survive the container (which has no node_modules).
          # Bun builtins (bun:sqlite, Bun.serve, fetch) stay external automatically.
          bun build packages/ybrain/src/index.ts \
            --bundle \
            --target=bun \
            --outfile=packages/ybrain/deploy/context/plugin/ybrain.js

      - name: Verify bundled plugin loads
        run: |
          bun -e '
            const m = await import("./packages/ybrain/deploy/context/plugin/ybrain.js")
            if (typeof m.server !== "function") {
              console.error("FAIL: plugin bundle does not export a `server` function")
              process.exit(1)
            }
            console.log("PASS: plugin bundle exports server(), keys:", Object.keys(m).join(","))
          '

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          IMAGE=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_IMAGE }}
          BRANCH=${GITHUB_REF_NAME}
          # Always tag by commit sha and by branch name so any branch build is pullable.
          TAGS="-t $IMAGE:${{ github.sha }} -t $IMAGE:$BRANCH"
          # Only the main branch moves the `latest` tag; dev builds never overwrite it.
          if [ "$BRANCH" = "main" ]; then
            TAGS="$TAGS -t $IMAGE:latest"
          fi
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            $TAGS \
            --push \
            packages/ybrain/deploy

      # P1-3：在与生产镜像相同的 debian-slim + vec0.so 环境里验证 bun:sqlite 扩展链路。
      # spike 阶段单独 COPY bun，不进入生产镜像。
      - name: Verify sqlite-vec in image (spike stage)
        run: |
          docker buildx build --target spike --load \
            --provenance=false \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t ybrain:spike \
            packages/ybrain/deploy
          docker run --rm ybrain:spike
